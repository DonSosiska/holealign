# Driven by run.sh; it exports every ${VAR} used below. Start order matters
# (homeserver -> server -> hosts) and is handled by run.sh via profiles.
name: holealign-e2e

x-host: &host
  build:
    context: ../..
    dockerfile: deploy/e2e/Dockerfile
    target: host
  image: holealign-e2e-host
  depends_on: []
  environment: &host-env
    HOLEALIGN_SERVER_URL: http://holealign-server:8080
    HOLEALIGN_ENROLL_TOKEN: ${E2E_ENROLL_TOKEN:-unset}

services:
  matrix:
    # Continuwuity (conduwuit successor): single static binary, no external DB.
    image: ${MATRIX_IMAGE:-ghcr.io/continuwuity/continuwuity:latest}
    environment:
      CONDUWUIT_SERVER_NAME: holealign.test
      CONDUWUIT_ADDRESS: 0.0.0.0
      CONDUWUIT_PORT: "8008"
      CONDUWUIT_DATABASE_PATH: /var/lib/conduwuit
      CONDUWUIT_ALLOW_REGISTRATION: "true"
      CONDUWUIT_REGISTRATION_TOKEN: ${E2E_REG_TOKEN:-e2e-reg-token}
      CONDUWUIT_ALLOW_FEDERATION: "false"
      CONDUWUIT_ALLOW_ANNOUNCEMENTS_CHECK: "false"
      CONDUWUIT_LOG: warn
    ports:
      - "127.0.0.1:${E2E_MATRIX_PORT:-18008}:8008"
    tmpfs:
      - /var/lib/conduwuit

  holealign-server:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile
      target: server
    image: holealign-e2e-server
    profiles: ["server"]
    environment:
      HOLEALIGN_CONFIG: /etc/holealign/server.yaml
      HOLEALIGN_PUBLIC_URL: http://localhost:${E2E_ADMIN_PORT:-18081}
      HOLEALIGN_ADMIN_LISTEN: 0.0.0.0:8081
      HOLEALIGN_FEEDS_UPDATE: ${E2E_FEEDS_UPDATE:-true}
      HOLEALIGN_MATRIX_HOMESERVER: http://matrix:8008
      HOLEALIGN_MATRIX_ACCESS_TOKEN_ENV: HOLEALIGN_E2E_MATRIX_BOT_TOKEN
      HOLEALIGN_MATRIX_DEFAULT_ROOMS: ${E2E_ROOM_DEFAULT:-}
      HOLEALIGN_E2E_MATRIX_BOT_TOKEN: ${E2E_BOT_TOKEN:-}
      HOLEALIGN_ADMIN_PASSWORD: ${HOLEALIGN_ADMIN_PASSWORD:-}
      # built-in local agent (assertion g): the server container monitors itself in-process
      HOLEALIGN_LOCAL_AGENT_ENABLED: ${E2E_LOCAL_AGENT:-true}
      HOLEALIGN_LOCAL_AGENT_SOURCE: inprocess
      # Optional LLM rule drafting for demos (e.g. a local Ollama on the host):
      # E2E_LLM_PROVIDER=openai-compatible E2E_LLM_BASE_URL=http://host.docker.internal:11434/v1 E2E_LLM_MODEL=<model>
      HOLEALIGN_LLM_PROVIDER: ${E2E_LLM_PROVIDER:-none}
      HOLEALIGN_LLM_MODEL: ${E2E_LLM_MODEL:-claude-sonnet-5-5}
      HOLEALIGN_LLM_BASE_URL: ${E2E_LLM_BASE_URL:-}
      HOLEALIGN_LLM_DAILY_LIMIT: ${E2E_LLM_DAILY_LIMIT:-50}
    volumes:
      - ${E2E_TMP:-/tmp}/server.yaml:/etc/holealign/server.yaml:ro
      - ${E2E_GRYPE_MOUNT:-e2e-grype-db}:/var/lib/holealign/grype-db
      - e2e-data:/var/lib/holealign
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an LLM on the host (Linux; built in on Docker Desktop)
    ports:
      - "127.0.0.1:${E2E_SERVER_PORT:-18080}:8080"
      - "127.0.0.1:${E2E_ADMIN_PORT:-18081}:8081"
    depends_on: [matrix]

  web-default:
    <<: *host
    profiles: ["hosts"]
    hostname: web-default
    environment:
      <<: *host-env
      HOST_LABELS: "prod,web"
      HOST_MACHINE_ID: "0000000000000000000000000000e201"

  web-lgt0:
    <<: *host
    profiles: ["hosts"]
    hostname: web-lgt0
    environment:
      <<: *host-env
      HOST_LABELS: "prod,web"
      HOST_MACHINE_ID: "0000000000000000000000000000e202"
      SSHD_EXTRA: "LoginGraceTime 0"

  staging-1:
    <<: *host
    profiles: ["hosts"]
    hostname: staging-1
    environment:
      <<: *host-env
      HOST_LABELS: "staging"
      HOST_MACHINE_ID: "0000000000000000000000000000e203"

volumes:
  e2e-grype-db:
  e2e-data:
