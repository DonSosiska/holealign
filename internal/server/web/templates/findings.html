{{define "title"}}Findings{{end}}
{{define "content"}}
<h1>Findings</h1>
<form method="get" action="/findings" class="filters">
  <label>Verdict
    <select name="verdict"><option value="">open (all but resolved)</option>
    {{range .Verdicts}}<option value="{{.}}" {{if eq (printf "%s" .) $.FVerdict}}selected{{end}}>{{vlabel .}}</option>{{end}}</select></label>
  <label>Label
    <select name="label"><option value="">any</option>
    {{range .Labels}}<option value="{{.}}" {{if eq . $.FLabel}}selected{{end}}>{{.}}</option>{{end}}</select></label>
  <label>Host
    <select name="host"><option value="">any</option>
    {{range .Hosts}}<option value="{{.ID}}" {{if eq .ID $.FHost}}selected{{end}}>{{.Hostname}}</option>{{end}}</select></label>
  <label>KEV
    <select name="kev"><option value="">any</option><option value="1" {{if eq .FKEV "1"}}selected{{end}}>yes</option><option value="0" {{if eq .FKEV "0"}}selected{{end}}>no</option></select></label>
  <label>Vulnerability ID <input name="q" value="{{.Q}}" placeholder="CVE-2024-6387"></label>
  <label>Show
    <select name="tier"><option value="">default (needs attention)</option>
    <option value="attention" {{if eq .FTier "attention"}}selected{{end}}>needs attention</option>
    <option value="background" {{if eq .FTier "background"}}selected{{end}}>background</option>
    <option value="all" {{if eq .FTier "all"}}selected{{end}}>all</option></select></label>
  {{if .L.PerPackage}}<input type="hidden" name="view" value="package">{{end}}
  <label class="check"><input type="checkbox" name="resolved" value="1" {{if .FResolved}}checked{{end}}> include resolved</label>
  <button type="submit" class="primary">Filter</button>
  <a href="/findings" class="btn">Reset</a>
</form>
{{template "listBody" (lbody .L .HostNames true)}}
{{end}}
