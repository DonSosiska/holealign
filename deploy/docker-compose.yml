# Single-host Holealign server.
#
#   cp deploy/server.env.example deploy/.env   # then set HOLEALIGN_ADMIN_PASSWORD etc.
#   cd deploy && docker compose up -d --build
#   docker compose exec holealign-server holealign-server token create first
#
# The server has no healthcheck: the distroless image has no shell or curl.
# Check it with: docker compose logs -f holealign-server
services:
  holealign-server:
    # Build from source. To use a prebuilt image instead, comment out "build"
    # and set image: ghcr.io/donsosiska/holealign-server:latest.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server.build
    image: holealign-server:local
    restart: unless-stopped
    # Two listeners:
    #   8080  agent API (/api/v1/*, /healthz only): monitored hosts must reach it, so it is published
    #         on all interfaces. Put a TLS reverse proxy in front of it, or set tls_cert/tls_key;
    #         plain HTTP exposes agent keys on the network.
    #   8081  admin web UI: published on loopback only, so monitored hosts cannot even reach the login
    #         page. Reach it through an SSH tunnel / VPN, or a TLS reverse proxy on this machine that
    #         forwards to 127.0.0.1:8081 (set HOLEALIGN_PUBLIC_URL to the proxy's https URL and, if
    #         it sets X-Forwarded-For, HOLEALIGN_TRUSTED_PROXIES to its address).
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # SQLite database and Grype DB cache.
      - holealign-data:/var/lib/holealign
      # Agentless mode, local_agent.source: collector. The Docker HOST runs holealign-collector.service
      # (install.sh --collector-only); mount its socket directory read-only. The collector accepts only
      # root and the host user "holealign" (SO_PEERCRED), so run this container as that uid/gid
      # (`id holealign` on the host) and add the group for socket access:
      #   - /run/holealign:/run/holealign:ro
      # with, on the service:
      #   user: "<holealign uid>:<holealign gid>"
      #   group_add: ["<holealign gid>"]
      # and HOLEALIGN_LOCAL_AGENT_ENABLED=true, HOLEALIGN_LOCAL_AGENT_SOURCE=collector.
      # Mind: source "inprocess" inside a container scans the CONTAINER (its own minimal filesystem), not
      # the Docker host; use the collector socket to monitor the host.
    environment:
      # Secrets come from deploy/.env. Empty values are ignored by the server.
      HOLEALIGN_ADMIN_PASSWORD: ${HOLEALIGN_ADMIN_PASSWORD:-}   # min 12 chars, first start only (or HOLEALIGN_ADMIN_PASSWORD_FILE)
      HOLEALIGN_MATRIX_TOKEN: ${HOLEALIGN_MATRIX_TOKEN:-}       # Matrix bot access token
      HOLEALIGN_LLM_API_KEY: ${HOLEALIGN_LLM_API_KEY:-}         # LLM provider key, if any
      # Non-secret overrides (optional).
      HOLEALIGN_PUBLIC_URL: ${HOLEALIGN_PUBLIC_URL:-http://localhost:8081}   # admin UI base URL
      # Inside the container the admin listener must bind to all interfaces; the published port
      # above restricts it to the host's loopback.
      HOLEALIGN_ADMIN_LISTEN: 0.0.0.0:8081
      HOLEALIGN_TRUSTED_PROXIES: ${HOLEALIGN_TRUSTED_PROXIES:-}
      HOLEALIGN_ALERTS_OPS_ROOMS: ${HOLEALIGN_ALERTS_OPS_ROOMS:-}   # Matrix rooms for silence/feed alerts
      HOLEALIGN_MATRIX_HOMESERVER: ${HOLEALIGN_MATRIX_HOMESERVER:-}
      HOLEALIGN_LLM_PROVIDER: ${HOLEALIGN_LLM_PROVIDER:-none}   # none | anthropic | openai-compatible
      HOLEALIGN_LLM_MODEL: ${HOLEALIGN_LLM_MODEL:-}
      HOLEALIGN_LLM_BASE_URL: ${HOLEALIGN_LLM_BASE_URL:-}       # openai-compatible only
      # Agentless mode (server monitors its own host), off by default. See the volume note above.
      HOLEALIGN_LOCAL_AGENT_ENABLED: ${HOLEALIGN_LOCAL_AGENT_ENABLED:-false}
      HOLEALIGN_LOCAL_AGENT_SOURCE: ${HOLEALIGN_LOCAL_AGENT_SOURCE:-auto}

volumes:
  holealign-data:
