name: ci

# pull_request (not pull_request_target): PRs from forks run without secrets
# and with a read-only token.
on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job, including on pull requests.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/govulncheck.sh

      - name: Shell checks for the installer and e2e scripts
        run: |
          sh -n deploy/install.sh
          shellcheck deploy/install.sh deploy/e2e/*.sh scripts/govulncheck.sh
