name: release

# Only tags are released. Whether a tag may release is decided by two gates:
#   1. The tagged commit must be an ancestor of origin/main (checked in the
#      release job below).
#   2. The release job runs in the "release" environment, which requires
#      approval from a reviewer (see SECURITY.md, "Release integrity").
on:
  push:
    tags: ["v*"]

# Read-only by default. Only the release job below gets write scopes.
permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

# One release per tag at a time. Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same checks as ci.yml. The release job does not start unless these pass.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/govulncheck.sh

      - name: Shell checks for the installer and e2e scripts
        run: |
          sh -n deploy/install.sh
          shellcheck deploy/install.sh deploy/e2e/*.sh scripts/govulncheck.sh

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    # Requires approval from the required reviewers of this environment.
    # Configure in repo settings: Settings > Environments > release:
    #   - add required reviewers,
    #   - restrict deployment branches/tags to protected tags (v*).
    environment: release
    permissions:
      contents: write      # create the GitHub release and upload artifacts
      packages: write      # push images to ghcr.io
      id-token: write      # keyless cosign signing (OIDC) and build provenance
      attestations: write  # store GitHub build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: goreleaser changelog and the origin/main check
          persist-credentials: false

      # Fail unless the tagged commit is reachable from main. A tag on a branch
      # or in a fork must not produce a signed release. Values are passed through
      # env, never interpolated into the script.
      - name: Require the tagged commit to be on main
        env:
          TAG_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is not available in this checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag $TAG_NAME ($TAG_SHA) is not an ancestor of origin/main; refusing to release"
            exit 1
          fi
          echo "tag $TAG_NAME ($TAG_SHA) is on main"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false   # this job signs and publishes: no restored build cache

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned tooling: exact versions, not ranges. Upgrade deliberately.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.5"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: "v1.57.2"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: attest the pushed image digests too. goreleaser's dist/artifacts.json
      # should carry the per-image digests, but the exact field layout was not
      # verified locally (goreleaser is not installed here), so no jq extraction
      # is guessed at. Once confirmed against a snapshot run, extract the digests
      # with jq and pass them to actions/attest-build-provenance (subject-digest).

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz, dist/*.deb, dist/*.rpm'
