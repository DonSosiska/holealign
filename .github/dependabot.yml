version: 2
updates:
  # Go modules (go.mod at the repository root).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly

  # Action versions. Dependabot updates the pinned SHA and the "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base image digests in the Dockerfiles.
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/deploy/e2e"
    schedule:
      interval: weekly
