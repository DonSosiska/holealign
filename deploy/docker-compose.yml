# Single-host Panoptes server.
#
#   cp deploy/server.env.example deploy/.env   # then set PANOPTES_ADMIN_PASSWORD etc.
#   cd deploy && docker compose up -d --build
#   docker compose exec panoptes-server panoptes-server token create first
#
# The server has no healthcheck: the distroless image has no shell or curl.
# Check it with: docker compose logs -f panoptes-server
services:
  panoptes-server:
    # Build from source. To use a prebuilt image instead, comment out "build"
    # and set image: ghcr.io/donsosiska/panoptes-server:latest.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server.build
    image: panoptes-server:local
    restart: unless-stopped
    # Two listeners:
    #   8080  agent API (/api/v1/*, /healthz only): monitored hosts must reach it, so it is published
    #         on all interfaces. Put a TLS reverse proxy in front of it, or set tls_cert/tls_key;
    #         plain HTTP exposes agent keys on the network.
    #   8081  admin web UI: published on loopback only, so monitored hosts cannot even reach the login
    #         page. Reach it through an SSH tunnel / VPN, or a TLS reverse proxy on this machine that
    #         forwards to 127.0.0.1:8081 (set PANOPTES_PUBLIC_URL to the proxy's https URL and, if
    #         it sets X-Forwarded-For, PANOPTES_TRUSTED_PROXIES to its address).
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # SQLite database and Grype DB cache.
      - panoptes-data:/var/lib/panoptes
    environment:
      # Secrets come from deploy/.env. Empty values are ignored by the server.
      PANOPTES_ADMIN_PASSWORD: ${PANOPTES_ADMIN_PASSWORD:-}   # min 12 chars, first start only (or PANOPTES_ADMIN_PASSWORD_FILE)
      PANOPTES_MATRIX_TOKEN: ${PANOPTES_MATRIX_TOKEN:-}       # Matrix bot access token
      PANOPTES_LLM_API_KEY: ${PANOPTES_LLM_API_KEY:-}         # LLM provider key, if any
      # Non-secret overrides (optional).
      PANOPTES_PUBLIC_URL: ${PANOPTES_PUBLIC_URL:-http://localhost:8081}   # admin UI base URL
      # Inside the container the admin listener must bind to all interfaces; the published port
      # above restricts it to the host's loopback.
      PANOPTES_ADMIN_LISTEN: 0.0.0.0:8081
      PANOPTES_TRUSTED_PROXIES: ${PANOPTES_TRUSTED_PROXIES:-}
      PANOPTES_ALERTS_OPS_ROOMS: ${PANOPTES_ALERTS_OPS_ROOMS:-}   # Matrix rooms for silence/feed alerts
      PANOPTES_MATRIX_HOMESERVER: ${PANOPTES_MATRIX_HOMESERVER:-}
      PANOPTES_LLM_PROVIDER: ${PANOPTES_LLM_PROVIDER:-none}   # none | anthropic | openai-compatible
      PANOPTES_LLM_MODEL: ${PANOPTES_LLM_MODEL:-}
      PANOPTES_LLM_BASE_URL: ${PANOPTES_LLM_BASE_URL:-}       # openai-compatible only

volumes:
  panoptes-data:
